const app=document.getElementById('app');let filter='All',search='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const completed=()=>{try{return JSON.parse(localStorage.getItem('olh-progress-v2')||'{}')}catch{return {}}};const save=(id)=>{const p=completed();p[id]=true;localStorage.setItem('olh-progress-v2',JSON.stringify(p))};const lessons=c=>c.modules.flatMap(m=>m.lessons);const card=c=>'<a class="card" href="#/course/'+c.id+'"><div class="art">'+c.icon+'</div><div class="meta">'+esc(c.category)+' · '+esc(c.level)+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.summary)+'</p><footer><span>'+c.modules.length+' modules</span><span>Explore course →</span></footer></a>';const catalog=(home=false)=>{const cats=['All',...new Set(courses.map(c=>c.category))];const matches=courses.filter(c=>(filter==='All'||c.category===filter)&&((c.title+' '+c.category+' '+c.summary).toLowerCase().includes(search.toLowerCase())));return (home?'<section class="hero"><div class="shell"><span class="eyebrow">YOUR LEARNING JOURNEY STARTS HERE</span><h1>Learn something <span class="accent">extraordinary.</span></h1><p class="sub">Discover practical courses in programming, artificial intelligence, data, cloud and business operations. Learn at your own pace, one skill at a time.</p><div class="search"><input id="searchInput" aria-label="Search courses" placeholder="Search Python, AI, SQL, WFM..." value="'+esc(search)+'"><button class="pill" id="searchBtn">Find courses →</button></div><div class="stats"><span><strong>'+courses.length+'</strong>Course outlines</span><span><strong>'+courses.reduce((a,c)=>a+c.modules.length,0)+'</strong>Modules</span><span><strong>Free</strong>Access</span></div></div></section>':'')+'<section class="section shell" id="catalog"><h2>'+(home?'Explore our courses':'All courses')+'</h2><p>Choose a subject and start building your skills.</p><div class="filters">'+cats.map(c=>'<button class="filter '+(filter===c?'active':'')+'" data-filter="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div class="cards">'+matches.map(card).join('')+'</div>'+(matches.length?'':'<div class="empty">No matching courses. Try another search or category.</div>')+'</section>'};const coursePage=c=>'<div class="shell"><div class="crumb"><a href="#/courses">All Courses</a> / '+esc(c.title)+'</div><div class="detail"><div><div class="meta">'+esc(c.category)+' · '+esc(c.level)+'</div><h1>'+c.icon+' '+esc(c.title)+'</h1><p class="sub" style="margin:0 0 25px">'+esc(c.summary)+'</p><div class="panel"><h2>Course syllabus</h2><p>Each module includes an introductory lesson and a practical checkpoint. More in-depth content is being authored.</p>'+c.modules.map((m,i)=>'<div class="module"><button data-module="'+i+'">▸ Module '+(i+1)+': '+esc(m.title)+'</button><div id="mod-'+i+'" hidden>'+m.lessons.map(l=>'<a class="lesson-link" href="#/learn/'+c.id+'/'+l.id+'">▶ '+esc(l.title)+'</a>').join('')+'</div></div>').join('')+'</div></div><aside><div class="panel"><div class="art">'+c.icon+'</div><h3>Start learning</h3><p>'+c.modules.length+' modules · '+lessons(c).length+' introductory lessons</p><a class="pill" style="display:block;text-align:center" href="#/learn/'+c.id+'/'+lessons(c)[0].id+'">Start course →</a></div></aside></div></div>';const lessonPage=(c,l)=>{const all=lessons(c),idx=all.findIndex(x=>x.id===l.id);return '<div class="shell"><div class="crumb"><a href="#/course/'+c.id+'">'+esc(c.title)+'</a> / Lesson '+(idx+1)+'</div><div class="reader"><aside class="sidebar"><b>'+esc(c.title)+'</b><p style="color:#6c7588;font-size:12px">'+all.filter(x=>completed()[x.id]).length+' / '+all.length+' completed</p>'+c.modules.map(m=>'<p style="font-size:12px;font-weight:800;margin:20px 0 6px">'+esc(m.title)+'</p>'+m.lessons.map(x=>'<a class="'+(x.id===l.id?'selected':'')+'" href="#/learn/'+c.id+'/'+x.id+'">'+(completed()[x.id]?'✓ ':'○ ')+esc(x.title)+'</a>').join('')).join('')+'</aside><article><div class="meta">LESSON '+(idx+1)+' OF '+all.length+'</div><h1>'+esc(l.title)+'</h1><p>'+esc(l.body)+'</p><h2>Put it into practice</h2><div class="callout">'+esc(l.task)+'</div><h2>Knowledge check</h2><p>'+esc(l.question)+'</p>'+l.choices.map((x,i)=>'<button class="choice" data-choice="'+i+'">'+esc(x)+'</button>').join('')+'<div id="feedback" class="feedback" aria-live="polite"></div><button class="pill" id="complete">Mark lesson complete ✓</button> '+(idx<all.length-1?'<a class="ghost" style="display:inline-block;margin-top:12px" href="#/learn/'+c.id+'/'+all[idx+1].id+'">Next lesson →</a>':'<a class="ghost" href="#/course/'+c.id+'">Back to course</a>')+'</article></div></div>'};function render(){const parts=decodeURIComponent(location.hash.slice(2)||'').split('/');const [page,id,lid]=parts;const c=courses.find(x=>x.id===id);if(page==='course'&&c)app.innerHTML=coursePage(c);else if(page==='learn'&&c){const l=lessons(c).find(x=>x.id===lid);app.innerHTML=l?lessonPage(c,l):'<div class="empty">Lesson not found.</div>'}else if(page==='progress'){const p=completed(),done=Object.keys(p).filter(x=>p[x]).length;app.innerHTML='<section class="section shell"><h1>My Learning</h1><p>'+done+' introductory lessons completed on this device. Progress is stored locally in your browser.</p><div class="cards">'+courses.filter(c=>lessons(c).some(l=>p[l.id])).map(card).join('')+'</div></section>'}else if(page==='paths')app.innerHTML='<section class="section shell"><h1>Learning paths</h1><p>Curated sequences to guide your learning.</p><div class="cards">'+[['Web Developer',['html-css','javascript','typescript','react']],['Data Analyst',['excel','sql','python','power-bi']],['AI Builder',['python','machine-learning','generative-ai']],['WFM Analyst',['wfm','excel','power-bi','power-automate']]].map(([title,ids])=>'<div class="card"><h3>'+title+'</h3><p>'+ids.map(id=>courses.find(c=>c.id===id).title).join(' → ')+'</p><a class="pill" href="#/course/'+ids[0]+'">Start path →</a></div>').join('')+'</div></section>';else app.innerHTML=catalog(page!=='courses');document.title='Open Learning Hub | '+(c?c.title:page==='progress'?'My Learning':page==='paths'?'Learning Paths':'Explore courses');window.scrollTo(0,0)}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;app.innerHTML=catalog(location.hash!=='#/courses');return}const m=e.target.closest('[data-module]');if(m){const el=document.getElementById('mod-'+m.dataset.module);el.hidden=!el.hidden}const choice=e.target.closest('[data-choice]');if(choice){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('chosen'));choice.classList.add('chosen');document.getElementById('feedback').textContent=Number(choice.dataset.choice)===1?'Correct! Learning by doing strengthens understanding.':'Try again. Think about applying the concepts.'}if(e.target.id==='complete'){const id=decodeURIComponent(location.hash.split('/').pop());save(id);render()}if(e.target.id==='searchBtn'){search=document.getElementById('searchInput').value;filter='All';location.hash='#/courses';render()}if(e.target.id==='explore')location.hash='#/courses';if(e.target.id==='menu'){const el=document.getElementById('mobileNav');el.hidden=!el.hidden}});document.addEventListener('input',e=>{if(e.target.id==='searchInput'){search=e.target.value;const pos=e.target.selectionStart;const input=e.target;const section=document.getElementById('catalog');const matches=courses.filter(c=>(filter==='All'||c.category===filter)&&((c.title+' '+c.category+' '+c.summary).toLowerCase().includes(search.toLowerCase())));section.querySelector('.cards').innerHTML=matches.map(card).join('');}});window.addEventListener('hashchange',render);render();
